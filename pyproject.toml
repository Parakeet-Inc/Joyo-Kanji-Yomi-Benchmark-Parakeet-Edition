[project]
name = "jkyb-eval"
version = "0.2.0"
description = "Evaluation tools for Joyo Kanji Yomi Benchmark: Parakeet Edition"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Parakeet Inc." },
]
dependencies = [
    "huggingface-hub>=0.34,<1",
    "jaconv>=0.5.0",
    "rapidfuzz>=3.14.5",
    "tqdm>=4.66",
]

[project.urls]
Repository = "https://github.com/Parakeet-Inc/Joyo-Kanji-Yomi-Benchmark-Parakeet-Edition"
Dataset = "https://huggingface.co/datasets/Parakeet-Inc/joyo-kanji-yomi-benchmark-parakeet"

[project.optional-dependencies]
asr = [
    "accelerate>=1.0",
    "soundfile>=0.13",
    "soxr>=1.0",
    "torch>=2.2",
    "transformers>=4.45,<5",
]

[project.scripts]
jkyb-eval = "jkyb_eval.cli:main"

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["docs/**"]

[tool.uv]
default-groups = []

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "asr", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
